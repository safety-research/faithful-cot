# defaults specify the default config from each component
defaults:

  # dp ref config, inheriting from trainer/config/ref/ref.yaml
  - ref
  
  # fsdp engine config
  - ../engine@fsdp_config: fsdp

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# Target class for this configuration
_target_: verl.workers.config.FSDPActorConfig

# fsdp config
fsdp_config:

  # ref model is forward only
  forward_only: True

# sequence parallel size
# same as actor_rollout_ref.actor.ulysses_sequence_parallel_size if it exists, otherwise 1
ulysses_sequence_parallel_size: ${oc.select:actor_rollout_ref.actor.ulysses_sequence_parallel_size,1}

# calculate entropy with chunking to reduce memory peak
entropy_from_logits_with_chunking: False

# recompute entropy
entropy_checkpointing: False

# CoT (Chain-of-Thought) masking configuration
# MUST match actor settings for consistent log prob computation
# Use same as actor if it exists, otherwise false
use_cot_masking: ${oc.select:actor_rollout_ref.actor.use_cot_masking,false}

# Token ID for <think> tag (must match actor)
think_token_id: ${oc.select:actor_rollout_ref.actor.think_token_id,151665}

# Token ID for </think> tag (must match actor)
end_think_token_id: ${oc.select:actor_rollout_ref.actor.end_think_token_id,151666}


# Use substring matching for delimiter detection (must match actor)
use_substring_delimiter_matching: ${oc.select:actor_rollout_ref.actor.use_substring_delimiter_matching,false}

# Delimiter string for substring matching mode (must match actor)
end_think_delimiter_str: ${oc.select:actor_rollout_ref.actor.end_think_delimiter_str,"</think>"}
